name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # No `|| npm install` fallback: when npm ci rejects an out-of-sync
        # package-lock.json, a fallback would resolve a different tree and let
        # CI pass on dependencies nobody committed.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # dist/popup.js is committed because popup.html loads it directly, so it
      # can drift from the sources it was built from. This is the guard.
      - name: Check the committed bundle is up to date
        run: npm run check:dist
